name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # cron every week on Monday
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Check formatting
        run: uv run ruff format --check --diff .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Spot-check the oldest and newest supported Python on the other
          # platforms; the full matrix runs on Linux.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install project
        # Without --no-default-groups this would also pull the dev group, and
        # with it the whole Sphinx stack, into all eight test jobs. The same
        # flags are needed on `uv run`, which otherwise re-syncs the defaults.
        run: uv sync --no-default-groups --group test
      - name: Test with pytest
        run: >
          uv run --no-default-groups --group test
          pytest tests --cov=btensor --cov-report=term-missing --cov-report=xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build docs
        run: uv run --group docs sphinx-build -W -b html docs/source docs/build/html
